version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: avance-produccion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: avance_produccion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - avance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avance_produccion"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avance-produccion-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/avance_produccion
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: local-dev-secret-please-change-min-32-characters
      CORS_ALLOWED_ORIGINS: http://localhost:4200

volumes:
  avance_postgres_data:
