spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    show-sql: false

logging:
  level:
    pe.betaagroindustrial.avance: INFO
    org.hibernate.SQL: WARN

# Railway expone la variable DATABASE_URL en formato postgres://user:pass@host:port/db
# Spring necesita el prefijo jdbc:. En Railway, definir estas 3 variables de entorno
# en el servicio backend (Settings > Variables), mapeando desde el plugin de Postgres:
#   SPRING_DATASOURCE_URL      = jdbc:postgresql://${{Postgres.PGHOST}}:${{Postgres.PGPORT}}/${{Postgres.PGDATABASE}}
#   SPRING_DATASOURCE_USERNAME = ${{Postgres.PGUSER}}
#   SPRING_DATASOURCE_PASSWORD = ${{Postgres.PGPASSWORD}}

# --- Produccion: secretos obligatorios (sin valor por defecto) ---
# Si falta JWT_SECRET la app NO arranca, en vez de usar el secreto publico de application.yml.
# Debe tener minimo 32 caracteres. Generar con: openssl rand -base64 48
app:
  security:
    jwt:
      secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Railway termina el HTTPS en su proxy: respetar X-Forwarded-* para URLs y esquema correctos
server:
  forward-headers-strategy: framework
